  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1727"/><stop offset="1" stop-color="#17283b"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42d9ce"/><stop offset="1" stop-color="#7ce3c9"/></linearGradient>
</defs>
<rect width="1120" height="340" rx="24" fill="url(#bg)"/>
<rect x="42" y="44" width="510" height="252" rx="25" fill="#1e2b3e" stroke="#33475b" stroke-width="2"/>
<text x="75" y="88" font-family="Arial,sans-serif" font-size="19" fill="#a9b9c9">Android status bar · illustrative</text>
