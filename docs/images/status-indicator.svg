<text x="303" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="40" fill="#ffffff">18</text>
<path d="M288 173 V197 M281 189 L288 197 L295 189" stroke="#61e0d1" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="311" y="202" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#61e0d1">M</text>
<rect x="392" y="131" width="25" height="47" rx="5" fill="none" stroke="#f2f6fb" stroke-width="3"/>
<rect x="398" y="127" width="13" height="4" rx="2" fill="#f2f6fb"/>
<rect x="398" y="143" width="13" height="29" rx="2" fill="#65e5bb"/>
<text x="76" y="260" font-family="Arial,sans-serif" font-size="18" fill="#9cb2c4">Number + direction + unit</text>
