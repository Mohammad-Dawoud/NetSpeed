<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
<title id="title">NetSpeed status-bar indicator illustration</title><desc id="desc">An example 18 megabits per second download reading with a downward arrow in a compact Android status bar icon.</desc>
