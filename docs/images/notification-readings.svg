<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
<title id="title">Separate download and upload notification illustration</title><desc id="desc">NetSpeed notification with the example Down 18 Mb per second — Up 110 Kb per second, using a teal color for readings.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1a2d3c"/></linearGradient></defs>
<rect width="1120" height="340" rx="24" fill="url(#bg)"/>
<text x="58" y="73" font-family="Arial,sans-serif" font-size="21" letter-spacing="2" font-weight="700" fill="#69ded4">SEPARATE DOWNLOAD &amp; UPLOAD</text>
<rect x="58" y="112" width="1004" height="171" rx="21" fill="#2b3037" stroke="#465763" stroke-width="2"/>
<rect x="91" y="136" width="70" height="108" rx="12" fill="#1e343a"/>
<text x="126" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#67e2d6">18</text>
<path d="M 106 196 V 224 M 98 216 L 106 224 L 114 216" stroke="#67e2d6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="127" y="229" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#67e2d6">M</text>
<text x="190" y="162" font-family="Arial,sans-serif" font-size="24" fill="#ffffff" font-weight="700">NetSpeed</text>
<text x="190" y="221" font-family="Arial,sans-serif" font-size="38" fill="#73e6da" font-weight="700">Down: 18 Mb/s — Up: 110 Kb/s</text>
<path d="M1003 168 l17 17 l17 -17" stroke="#cbd7e3" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="316" font-family="Arial,sans-serif" font-size="17" fill="#a1b6c8">Illustrative preview • rates update while the app is running</text>
</svg>