name: Publish signed release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag, version, and main ancestry
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag must refer to a commit already merged into main"; exit 1;
          }
          version="${TAG_NAME#v}"
          grep -Fq "versionName = \"$version\"" app/build.gradle.kts || {
            echo "Android versionName must match tag version"; exit 1;
          }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK packages are installed
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          fi

      - name: Validate signing secrets and install release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NETSPEED_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NETSPEED_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NETSPEED_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NETSPEED_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "Signing secrets are missing; nothing will be released."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netspeed-release.jks"
          test -s "$RUNNER_TEMP/netspeed-release.jks"
          echo "NETSPEED_RELEASE_KEYSTORE=$RUNNER_TEMP/netspeed-release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        env:
          NETSPEED_RELEASE_STORE_PASSWORD: ${{ secrets.NETSPEED_RELEASE_STORE_PASSWORD }}
          NETSPEED_RELEASE_KEY_ALIAS: ${{ secrets.NETSPEED_RELEASE_KEY_ALIAS }}
          NETSPEED_RELEASE_KEY_PASSWORD: ${{ secrets.NETSPEED_RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signature and prepare release assets
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 31 --verbose "$apk"
          mkdir -p dist
          cp "$apk" "dist/NetSpeed-$GITHUB_REF_NAME.apk"
          (
            cd dist
            sha256sum "NetSpeed-$GITHUB_REF_NAME.apk" > "NetSpeed-$GITHUB_REF_NAME.apk.sha256"
          )

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/NetSpeed-$GITHUB_REF_NAME.apk" \
            "dist/NetSpeed-$GITHUB_REF_NAME.apk.sha256" \
            --title "NetSpeed $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
